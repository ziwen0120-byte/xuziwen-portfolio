<!doctype html>
<html lang="zh-CN" data-scope="/xuziwen-portfolio/">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'">
  <title>私密作品集 · 访问验证</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:28px;background:#f5f4ef;color:#171817;font-family:system-ui,-apple-system,'PingFang SC',sans-serif}main{width:min(100%,400px)}h1{font-size:32px;line-height:1.4;font-weight:500;letter-spacing:-.025em;margin:0 0 16px}p{color:#64675e;font-size:14px;line-height:1.8;margin:0 0 32px}label{display:block;font-size:13px;margin-bottom:12px}input{display:block;width:100%;height:52px;padding:0 14px;border:1px solid #aeb3a5;background:#fff;color:#171817;border-radius:0;font:inherit;font-size:16px}button{width:100%;min-height:50px;margin-top:16px;border:1px solid #171817;background:#171817;color:#fff;font:inherit;font-size:14px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}input:focus-visible,button:focus-visible{outline:2px solid #56644d;outline-offset:4px}.note{font-size:12px;margin-top:22px;margin-bottom:0} [role=status]{min-height:44px;font-size:13px;margin-top:16px;line-height:1.7;color:#7b332c}
  </style>
  <script src="/xuziwen-portfolio/core.js" defer></script><script src="/xuziwen-portfolio/gate.js" defer></script>
</head>
<body><main><h1>私密作品集</h1><p>请输入访问密码，查看完整作品与设计经历。</p><form><label for="password">访问密码</label><input id="password" type="password" required maxlength="256" autocomplete="current-password"><button type="submit" disabled>进入作品集</button></form><div role="status" aria-live="polite">正在准备访问验证…</div><p class="note">验证后，本浏览器可访问 2 小时。你也可以在页尾退出访问。</p><noscript><p>请开启 JavaScript 后访问。</p></noscript></main></body>
</html>
